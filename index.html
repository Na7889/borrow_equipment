<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบยืม-คืนอุปกรณ์วิทยาศาสตร์</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1e1b4b;--mute:#64748b;--line:#e2e8f0;--p1:#06b6d4;--p2:#6366f1;--p3:#a855f7;--grad:linear-gradient(135deg,var(--p1),var(--p2) 60%,var(--p3));color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.65 "Noto Sans Thai",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
background:radial-gradient(60% 40% at 10% 0%,#cffafe99,transparent),radial-gradient(50% 40% at 100% 20%,#ede9fe99,transparent),radial-gradient(50% 40% at 0% 100%,#fef3c799,transparent),#f8fafc;background-attachment:fixed}
header{position:relative;text-align:center;color:#fff;background:var(--grad);padding:30px 20px 52px;border-radius:0 0 40px 40px;box-shadow:0 12px 32px -12px #6366f199}
.brand{font-size:21px;font-weight:600;letter-spacing:-.01em}
header small{color:#ffffffd9}
header .b.g{position:absolute;top:16px;right:16px;padding:6px 14px;background:#ffffff2e;color:#fff;border:1px solid #ffffff55;box-shadow:none;backdrop-filter:blur(6px)}
header>div{padding:0 80px}
nav{position:sticky;top:12px;z-index:5;display:flex;gap:4px;width:fit-content;max-width:calc(100% - 24px);overflow-x:auto;margin:-26px auto 0;padding:6px;background:#fff;border-radius:99px;box-shadow:0 10px 30px -10px #6366f155;scrollbar-width:none}
nav button{white-space:nowrap;padding:8px 18px;border:0;border-radius:99px;background:none;color:var(--mute);font:inherit;font-size:14px;cursor:pointer;transition:.2s}
nav button:hover{background:#eef2ff;color:var(--p2)}
nav button.on{background:var(--grad);color:#fff;font-weight:500;box-shadow:0 6px 14px -6px #6366f1}
main{max-width:720px;margin:0 auto;padding:26px 16px 60px}
main>p{color:var(--mute);text-align:center;padding:40px 0}
.card{background:#fff;border:1px solid #fff;border-radius:24px;padding:18px 20px;margin-bottom:14px;box-shadow:0 8px 28px -14px #6366f155,0 1px 2px #0000000a;transition:.2s}
.card:hover{transform:translateY(-1px);box-shadow:0 14px 34px -14px #6366f177}
.row{display:flex;justify-content:space-between;align-items:center;gap:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin-left:4px}
input,select{width:100%;padding:12px 16px;margin:6px 0 14px;border:1.5px solid var(--line);border-radius:16px;background:#f8fafc;color:var(--ink);font:inherit;outline:0;transition:.2s}
input:focus,select:focus{background:#fff;border-color:var(--p2);box-shadow:0 0 0 4px #6366f126}
.b{background:var(--grad);color:#fff;border:0;border-radius:99px;padding:10px 22px;font:inherit;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 8px 18px -8px #6366f1;transition:.2s}
.b:hover{transform:translateY(-1px);box-shadow:0 12px 22px -8px #6366f1}.b:active{transform:none}
.b:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed;transform:none}
.b.g{background:#fff;color:#475569;border:1.5px solid var(--line);box-shadow:none}.b.g:hover{background:#f8fafc;box-shadow:none}
.b.r{background:linear-gradient(135deg,#fb7185,#e11d48)}
.card .b{margin:6px 8px 0 0}.card .row .b{margin:0}
.tag{display:inline-block;font-size:12px;font-weight:500;padding:3px 12px;border-radius:99px;background:#e0e7ff;color:#4338ca}
.tag.ok{background:#d1fae5;color:#047857}.tag.warn{background:#ffe4e6;color:#be123c}.tag.pend{background:#fef3c7;color:#b45309}
small{color:var(--mute);font-size:13px}
ul{padding-left:18px;margin:10px 0}li{margin:2px 0}
.ic{flex:none;width:48px;height:48px;border-radius:18px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 15%,#fff)}
.num{font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.grid>.card:nth-child(1){background:linear-gradient(135deg,#e0f2fe,#fff)}.grid>.card:nth-child(1) .num{color:#0284c7}
.grid>.card:nth-child(2){background:linear-gradient(135deg,#ede9fe,#fff)}.grid>.card:nth-child(2) .num{color:#7c3aed}
.grid>.card:nth-child(3){background:linear-gradient(135deg,#ffe4e6,#fff)}.grid>.card:nth-child(3) .num{color:#e11d48}
.grid>.card:nth-child(4){background:linear-gradient(135deg,#d1fae5,#fff)}.grid>.card:nth-child(4) .num{color:#059669}
.login{max-width:400px;margin:8vh auto 40px;padding:34px 28px;border-radius:32px;text-align:center}
.login label{text-align:left}
.login h1{font-size:26px;line-height:1.3;font-weight:600;letter-spacing:-.02em;margin:0 0 6px}
.logo{width:68px;height:68px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;font-size:32px;background:var(--grad);box-shadow:0 14px 28px -10px #6366f1}
.sub{color:var(--mute);margin:0 0 24px}
.alt{text-align:center;margin:18px 0 0;font-size:14px;color:var(--mute)}
a{color:var(--p2);text-decoration:none;font-weight:500}
#reader{border-radius:20px;overflow:hidden;margin-bottom:12px}
dialog{border:0;border-radius:28px;padding:22px;width:min(92vw,480px);background:#fff;color:var(--ink);box-shadow:0 30px 60px -20px #1e1b4b66}
dialog::backdrop{background:#1e1b4b66;backdrop-filter:blur(4px)}
dialog h3{margin:0 0 14px;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chip{white-space:nowrap;border:1.5px solid var(--line);background:#fff;color:var(--mute);border-radius:99px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:#eef2ff;border-color:var(--p2);color:var(--p2);font-weight:500}
.why{background:#f8fafc;border-radius:14px;padding:8px 12px;margin:10px 0 0;font-size:14px}
#pop{text-align:center;width:min(86vw,360px);padding:30px 24px 24px}
#pop[open]{animation:rise .25s ease}
#pop h3{margin:16px 0 6px;font-size:19px}
#pop p{margin:0 0 22px;color:var(--mute);white-space:pre-line;word-break:break-word}
#pop .b{min-width:120px}#pop input{margin:12px 0 20px}
.row2{display:flex;gap:10px;justify-content:center}
.pi{width:66px;height:66px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:30px;font-weight:700;color:#fff;animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
.pi.ok{background:linear-gradient(135deg,#34d399,#059669);box-shadow:0 14px 26px -10px #059669}
.pi.warn{background:linear-gradient(135deg,#fbbf24,#f97316);box-shadow:0 14px 26px -10px #f97316}
.pi.error{background:linear-gradient(135deg,#fb7185,#e11d48);box-shadow:0 14px 26px -10px #e11d48}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<dialog id="pop"></dialog>
<script>
/* ===== ตั้งค่า: ใส่ URL ของ Web App (ลงท้าย /exec) ===== */
const API = 'https://script.google.com/macros/s/AKfycbwkEKaV0YQ4FRUApBPZ3J9hdHaopY2THV91drF71Qdx2Ymmll0POiKBVnAIaoL0R6n3/exec';

const CATS = ['ฟิสิกส์','เคมี','ชีววิทยา','โลกและดาราศาสตร์','ทั่วไป'];
const TYPES = ['อุปกรณ์ทั่วไป','อุปกรณ์ราคาสูง','วัสดุสิ้นเปลือง'];
const RT = { student: 'นักเรียน', teacher: 'ครู', staff: 'เจ้าหน้าที่', admin: 'ผู้ดูแลระบบ' };
const CC = { 'ฟิสิกส์':'#3b82f6','เคมี':'#ec4899','ชีววิทยา':'#10b981','โลกและดาราศาสตร์':'#8b5cf6','ทั่วไป':'#f59e0b' };
const CI = { 'ฟิสิกส์':'⚛️','เคมี':'🧪','ชีววิทยา':'🧬','โลกและดาราศาสตร์':'🌍','ทั่วไป':'🔧' };
const S = { token: localStorage.t || '', user: JSON.parse(localStorage.u || 'null'), eq: [], cart: {}, loans: [], tab: 'eq', q: '', reg: false, users: [], lf: 'pending', free: true, cat: '' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) : '-';
const canBorrow = () => ['student', 'teacher', 'admin'].includes(S.user.role);
const canApprove = () => ['teacher', 'staff', 'admin'].includes(S.user.role);
const isKeeper = () => ['staff', 'admin'].includes(S.user.role);
const cartN = () => Object.values(S.cart).reduce((a, b) => a + b, 0);

async function api(action, data = {}) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ action, token: S.token, data }) }); // text/plain เลี่ยง CORS preflight
  const j = await r.json();
  if (!j.ok) { if (j.code === 'AUTH') logout(); throw new Error(j.error); }
  return j.data;
}
const run = async fn => { try { await fn(); } catch (e) { popup(e.message, 'error'); } };

function logout() { localStorage.clear(); S.token = ''; S.user = null; render(); }
function go(t) { S.tab = t; render(); }

function render() {
  if (!S.token && S.reg) return $('#app').innerHTML = regView();
  if (!S.token) return $('#app').innerHTML = `<div class="card login"><div class="logo">🔬</div><h1>ยืม-คืนอุปกรณ์<br>วิทยาศาสตร์</h1><p class="sub">เข้าสู่ระบบเพื่อเริ่มใช้งาน</p>
    <label>รหัสผู้ใช้</label><input id="uid" autocomplete="username"><label>PIN</label><input id="pin" type="password" autocomplete="current-password">
    <button class="b" style="width:100%" onclick="doLogin()">เข้าสู่ระบบ</button>
    <p class="alt"><a href="#" onclick="S.reg=true;render();return false">ยังไม่มีบัญชี? ลงทะเบียน</a></p></div>`;
  const tabs = [['eq','อุปกรณ์']].concat(canBorrow() ? [['cart','ตะกร้า']] : [], [['loans', canApprove() ? 'คำขอ/รายการยืม' : 'รายการของฉัน']], isKeeper() ? [['demand','ภาพรวม'],['dash','แดชบอร์ด'],['add','เพิ่มอุปกรณ์']] : []).concat(S.user.role === 'admin' ? [['users','ผู้ใช้']] : []);
  $('#app').innerHTML = `<header><div><div class="brand">ยืม-คืนอุปกรณ์วิทยาศาสตร์</div><small>${esc(S.user.name)} · ${RT[S.user.role]}</small></div><button class="b g" onclick="logout()">ออกจากระบบ</button></header>
    <nav>${tabs.map(([k, l]) => `<button class="${S.tab == k ? 'on' : ''}" onclick="go('${k}')">${l}${k == 'cart' ? ` (<span id="cn">${cartN()}</span>)` : ''}</button>`).join('')}</nav><main id="main"></main>`;
  ({ eq: vEq, cart: vCart, loans: vLoans, dash: vDash, add: vAdd, users: vUsers, demand: vDemand })[S.tab]();
}

function doLogin() {
  run(async () => {
    const r = await api('login', { user_id: $('#uid').value.trim(), pin: $('#pin').value });
    S.token = r.token; S.user = r.user; localStorage.t = r.token; localStorage.u = JSON.stringify(r.user); render();
  });
}

/* ---------- อุปกรณ์ + สแกน QR ---------- */
function vEq() {
  $('#main').innerHTML = `<div class="row"><input id="q" placeholder="ค้นหาอุปกรณ์..." value="${esc(S.q)}" oninput="S.q=this.value;drawEq()">
    <button class="b g" style="margin-bottom:6px;white-space:nowrap" onclick="scan()">สแกน QR</button></div><div class="chips"><button class="chip ${S.free ? 'on' : ''}" onclick="S.free=!S.free;vEq()">เฉพาะที่ว่าง</button>${['', ...CATS].map(c => `<button class="chip ${S.cat === c ? 'on' : ''}" onclick="S.cat='${c}';vEq()">${c || 'ทุกหมวด'}</button>`).join('')}</div><div id="reader"></div><div id="list"></div>`;
  S.eq.length ? drawEq() : run(async () => { S.eq = await api('getEquipment'); drawEq(); });
}
function drawEq() {
  const q = S.q.toLowerCase();
  $('#list').innerHTML = S.eq.filter(e => (e.name + e.category + e.equip_id).toLowerCase().includes(q) && (!S.free || (e.status === 'ใช้งานได้' && +e.available_qty > 0)) && (!S.cat || e.category === S.cat)).map(e => {
    const ok = e.status === 'ใช้งานได้' && +e.available_qty > 0;
    return `<div class="card row"><div class="ic" style="--c:${CC[e.category] || '#64748b'}">${CI[e.category] || '🔧'}</div><div style="flex:1"><b style="font-weight:600">${esc(e.name)}</b> ${e.requires_approval === 'Y' ? '<span class="tag pend">ต้องอนุมัติ</span>' : ''}<br>
      <small>${esc(e.equip_id)} · ${esc(e.category)} · ${esc(e.location)}</small><br>
      <span class="tag ${+e.available_qty ? 'ok' : 'warn'}">คงเหลือ ${e.available_qty}/${e.total_qty} ${esc(e.unit)}</span></div>
      ${canBorrow() ? `<button class="b" ${ok ? '' : 'disabled'} onclick="addCart('${e.equip_id}')">+ ยืม</button>` : ''}</div>`;
  }).join('') || '<p>ไม่พบอุปกรณ์</p>';
}
function addCart(id) {
  if (!canBorrow()) return popup('บทบาทนี้ไม่สามารถยืมอุปกรณ์ได้');
  const e = S.eq.find(x => x.equip_id === id);
  if (!e) return popup('ไม่พบรหัสอุปกรณ์ ' + id);
  if ((S.cart[id] || 0) >= +e.available_qty) return popup('เกินจำนวนคงเหลือ');
  S.cart[id] = (S.cart[id] || 0) + 1; $('#cn').textContent = cartN();
}
function scan() {
  const r = new Html5Qrcode('reader');
  r.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, txt => {
    r.stop().then(() => { $('#reader').innerHTML = ''; addCart(txt.trim()); });
  }).catch(() => popup('เปิดกล้องไม่ได้ (ต้องเข้าผ่าน https และอนุญาตกล้อง)'));
}

/* ---------- ตะกร้า / ยืม ---------- */
function vCart() {
  const ids = Object.keys(S.cart);
  $('#main').innerHTML = ids.length ? ids.map(id => { const e = S.eq.find(x => x.equip_id === id) || {};
    return `<div class="card row"><div><b>${esc(e.name)}</b><br><small>${id}</small></div><div>
      <button class="b g" onclick="chg('${id}',-1)">−</button> <b>${S.cart[id]}</b> <button class="b g" onclick="chg('${id}',1)">+</button></div></div>`; }).join('') +
    `<div class="card"><label>เหตุผลที่ยืม *</label><input id="pp" placeholder="เช่น ทดลองการกรองน้ำ วิชาเคมี ม.4"><label>ชื่อกลุ่มทดลอง</label><input id="gn"><label>วิชา/คาบเรียน</label><input id="sc">
    <label>จำนวนวันที่ยืม</label><input id="dy" type="number" min="1" value="1"><button class="b" style="width:100%" onclick="submitLoan()">ยืนยันการยืม</button></div>`
    : '<p>ตะกร้าว่าง — เลือกอุปกรณ์ที่แท็บ "อุปกรณ์" หรือสแกน QR</p>';
}
function chg(id, d) {
  const e = S.eq.find(x => x.equip_id === id), n = (S.cart[id] || 0) + d;
  if (n <= 0) delete S.cart[id]; else if (n <= +e.available_qty) S.cart[id] = n;
  vCart();
}
function submitLoan() {
  if (!$('#pp').value.trim()) return popup('กรุณาระบุเหตุผลที่ยืม');
  run(async () => {
    const r = await api('createLoan', { items: Object.entries(S.cart).map(([equip_id, qty]) => ({ equip_id, qty })),
      purpose: $('#pp').value, group_name: $('#gn').value, subject_class: $('#sc').value, days: $('#dy').value });
    popup(r.status === 'รออนุมัติ' ? `ส่งคำขอแล้ว (${r.loan_id}) รอครูอนุมัติ` : `บันทึกการยืมแล้ว ${r.loan_id}`);
    S.cart = {}; S.eq = []; go('loans');
  });
}

/* ---------- รายการยืม / อนุมัติ / คืน ---------- */
function vLoans() {
  $('#main').innerHTML = '<p>กำลังโหลด...</p>';
  run(async () => { S.loans = await api(canApprove() ? 'getAllLoans' : 'getMyLoans'); drawLoans(); });
}
function drawLoans() {
  const me = String(S.user.user_id), f = S.lf, ap = canApprove();
  const cls = l => l.overdue ? 'warn' : l.status === 'รออนุมัติ' ? 'pend' : l.status === 'คืนแล้ว' ? 'ok' : '';
  const nP = S.loans.filter(l => l.status === 'รออนุมัติ').length;
  const chips = ap ? `<div class="chips">${[['pending', 'รออนุมัติ (' + nP + ')'], ['mine', 'ของฉัน'], ['all', 'ทั้งหมด']].map(([k, t]) => `<button class="chip ${f == k ? 'on' : ''}" onclick="S.lf='${k}';drawLoans()">${t}</button>`).join('')}</div>` : '';
  const list = S.loans.filter(l => !ap || f === 'all' || (f === 'pending' ? l.status === 'รออนุมัติ' : String(l.borrower_id) === me));
  $('#main').innerHTML = chips + (list.map(l => {
    const mine = String(l.borrower_id) === me, active = ['ยืมอยู่', 'คืนบางส่วน'].includes(l.status);
    return `<div class="card"><div class="row"><b>${l.loan_id}</b><span class="tag ${cls(l)}">${l.overdue ? 'เกินกำหนด' : l.status}</span></div>
    <small>${esc(l.borrower_name)} ${l.group_name ? '· กลุ่ม ' + esc(l.group_name) : ''}<br>ยืม ${fmt(l.loan_date)} · กำหนดคืน ${fmt(l.due_date)}</small>
    ${l.purpose ? `<p class="why">เหตุผล: ${esc(l.purpose)}</p>` : ''}
    <ul>${l.items.map(i => `<li>${esc(i.name)} × ${i.qty} <small>(คืนแล้ว ${i.returned_qty})</small></li>`).join('')}</ul>
    ${l.status === 'รออนุมัติ' && ap && !mine ? `<button class="b" onclick="approve('${l.loan_id}')">อนุมัติ</button><button class="b g" onclick="reject('${l.loan_id}')">ไม่อนุมัติ</button>` : ''}
    ${isKeeper() && active ? `<button class="b" onclick="openReturn('${l.loan_id}')">รับคืน</button>` : ''}
    ${mine && active ? `<button class="b g" onclick="pickPhoto('${l.loan_id}')">📷 ${l.return_photo_url ? 'ถ่ายรูปใหม่' : 'บันทึกรูปหลังใช้งาน'}</button>` : ''}
    ${l.return_photo_url ? `<button class="b g" onclick="viewPhoto('${l.loan_id}')">ดูรูป</button>` : ''}</div>`;
  }).join('') || '<p>ไม่มีรายการ</p>');
}
async function reject(id) { const r = await ask('ไม่อนุมัติคำขอนี้', 'ระบุเหตุผล'); if (r !== null) run(async () => { await api('rejectLoan', { loan_id: id, reason: r }); vLoans(); }); }
function pickPhoto(id) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.capture = 'environment';
  i.onchange = () => { if (i.files[0]) run(async () => { await api('uploadReturnPhoto', { loan_id: id, image: await shrink(i.files[0]) }); popup('บันทึกรูปแล้ว'); vLoans(); }); };
  i.click();
}
function shrink(file) {
  return new Promise((ok, no) => {
    const im = new Image();
    im.onload = () => { const k = Math.min(1, 1024 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k; c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .72)); };
    im.onerror = () => no(new Error('อ่านไฟล์รูปไม่ได้')); im.src = URL.createObjectURL(file);
  });
}
function viewPhoto(id) {
  run(async () => { const r = await api('getPhoto', { loan_id: id }), d = $('#dlg');
    d.innerHTML = `<h3>รูปหลังใช้งาน · ${id}</h3><img src="${r.data}" style="width:100%;border-radius:18px"><br><br><button class="b g" onclick="$('#dlg').close()">ปิด</button>`; d.showModal(); });
}

/* ---------- ภาพรวมความต้องการ (staff) ---------- */
function vDemand() {
  $('#main').innerHTML = '<p>กำลังโหลด...</p>';
  run(async () => {
    const d = await api('getDemand'), short = d.filter(o => o.shortfall).length;
    $('#main').innerHTML = `<div class="card"><b>ภาพรวมความต้องการ</b><br><small>${d.filter(o => o.pending_qty).length} รายการรออนุมัติ · ${short ? 'สต็อกไม่พอ ' + short + ' รายการ' : 'สต็อกเพียงพอ'}</small></div>` +
      (d.map(o => `<div class="card"><div class="row"><div class="ic" style="--c:${CC[o.category] || '#64748b'}">${CI[o.category] || '🔧'}</div>
        <div style="flex:1"><b>${esc(o.name)}</b><br><small>${esc(o.type)} · ว่าง ${o.available_qty}/${o.total_qty} ${esc(o.unit)}</small></div>
        <div style="text-align:right"><div class="num" style="font-size:26px">${o.pending_qty}</div><small>ที่ขอ (${esc(o.unit)})</small></div></div>
        <div style="margin-top:8px">${o.shortfall ? `<span class="tag warn">ขาด ${o.shortfall}</span> ` : ''}<span class="tag">กำลังใช้ ${o.in_use_qty}</span></div>
        ${o.requesters.length ? `<ul>${o.requesters.map(r => `<li>${esc(r.name)} × ${r.qty} <small>${esc(r.purpose)} · ${r.loan_id}</small></li>`).join('')}</ul>` : ''}</div>`).join('') || '<p>ยังไม่มีความต้องการ</p>');
  });
}
function approve(id) { run(async () => { await api('approveLoan', { loan_id: id }); S.eq = []; vLoans(); }); }
function openReturn(id) {
  const l = S.loans.find(x => x.loan_id === id), d = $('#dlg');
  d.innerHTML = `<h3>รับคืน ${id}</h3>` + l.items.filter(i => i.qty > i.returned_qty).map((i, k) =>
    `<div class="card"><b>${esc(i.name)}</b> <small>ค้างคืน ${i.qty - i.returned_qty}</small>
    <div class="grid"><input type="number" min="0" max="${i.qty - i.returned_qty}" value="${i.qty - i.returned_qty}" id="rq${k}">
    <select id="rc${k}"><option>ดี</option><option>พอใช้</option><option>ชำรุด</option></select></div></div>`).join('') +
    `<div class="row"><button class="b g" onclick="$('#dlg').close()">ยกเลิก</button><button class="b" onclick="doReturn('${id}')">ยืนยันรับคืน</button></div>`;
  d.showModal();
}
function doReturn(id) {
  const l = S.loans.find(x => x.loan_id === id);
  const items = l.items.filter(i => i.qty > i.returned_qty).map((i, k) => ({ equip_id: i.equip_id, returned_qty: +$('#rq' + k).value, condition_in: $('#rc' + k).value }));
  run(async () => { await api('returnLoan', { loan_id: id, items }); $('#dlg').close(); S.eq = []; vLoans(); });
}

/* ---------- แดชบอร์ด / เพิ่มอุปกรณ์ (เจ้าหน้าที่) ---------- */
function vDash() {
  $('#main').innerHTML = '<p>กำลังโหลด...</p>';
  run(async () => {
    const d = await api('getDashboard'), box = (n, t, c = '') => `<div class="card"><div class="num ${c}">${n}</div><small>${t}</small></div>`;
    $('#main').innerHTML = `<div class="grid">${box(d.equipment_types, 'รายการอุปกรณ์')}${box(d.active_loans, 'กำลังถูกยืม')}${box(d.overdue, 'เกินกำหนดคืน', d.overdue ? 'warn' : '')}${box(d.pending, 'รออนุมัติ')}</div>
      <div class="card"><b>สต็อกต่ำ</b>${d.low_stock.map(e => `<div class="row"><span>${esc(e.name)}</span><span class="tag warn">${e.available_qty} / ขั้นต่ำ ${e.min_stock}</span></div>`).join('') || '<br><small>ไม่มี</small>'}</div>`;
  });
}
function vAdd() {
  const opt = a => a.map(x => `<option>${x}</option>`).join('');
  $('#main').innerHTML = `<div class="card"><label>ชื่ออุปกรณ์</label><input id="n"><label>หมวด</label><select id="c">${opt(CATS)}</select>
    <label>ประเภท</label><select id="t">${opt(TYPES)}</select><div class="grid"><div><label>จำนวน</label><input id="tq" type="number" value="1"></div><div><label>หน่วย</label><input id="u" value="ชิ้น"></div></div>
    <label>จำนวนขั้นต่ำ (แจ้งเตือน)</label><input id="ms" type="number" value="0"><label>ที่เก็บ</label><input id="lc">
    <label>ต้องให้ครูอนุมัติ (เช่น สารเคมี)</label><select id="ra"><option>N</option><option>Y</option></select>
    <button class="b" style="width:100%" onclick="saveEq()">บันทึก</button></div>`;
}
function saveEq() {
  run(async () => {
    const r = await api('addEquipment', { name: $('#n').value, category: $('#c').value, type: $('#t').value, total_qty: $('#tq').value,
      unit: $('#u').value, min_stock: $('#ms').value, location: $('#lc').value, requires_approval: $('#ra').value });
    popup('เพิ่มแล้ว รหัส ' + r.equip_id + ' (ใช้รหัสนี้สร้าง QR Code)'); S.eq = []; go('eq');
  });
}

/* ---------- ลงทะเบียน ---------- */
function regView() {
  return `<div class="card login"><div class="logo">✨</div><h1>ลงทะเบียน</h1><p class="sub">สร้างบัญชีผู้ใช้ใหม่</p>
    <label>รหัสผู้ใช้ (ตัวอักษรอังกฤษ/ตัวเลข 3-20 ตัว เช่น รหัสนักเรียน)</label><input id="ru" autocomplete="off">
    <label>ชื่อ-นามสกุล</label><input id="rn">
    <label>สถานะ</label><select id="rr"><option value="student">นักเรียน</option><option value="teacher">ครู (รอผู้ดูแลอนุมัติ)</option><option value="staff">เจ้าหน้าที่ห้องปฏิบัติการ (รอผู้ดูแลอนุมัติ)</option></select>
    <label>ชั้น/ห้อง (สำหรับนักเรียน)</label><input id="rc" placeholder="เช่น ม.4/2">
    <label>อีเมลโรงเรียน (ถ้ามี)</label><input id="re" type="email">
    <label>PIN (ตัวเลข 4-8 หลัก)</label><input id="rp" type="password" inputmode="numeric">
    <label>ยืนยัน PIN</label><input id="rp2" type="password" inputmode="numeric">
    <label>รหัสลงทะเบียน (ถ้าโรงเรียนกำหนด)</label><input id="rk" autocomplete="off">
    <button class="b" style="width:100%" onclick="doRegister()">ลงทะเบียน</button>
    <p class="alt"><a href="#" onclick="S.reg=false;render();return false">← กลับไปเข้าสู่ระบบ</a></p></div>`;
}
function doRegister() {
  if ($('#rp').value !== $('#rp2').value) return popup('PIN ทั้งสองช่องไม่ตรงกัน');
  run(async () => {
    const r = await api('register', { user_id: $('#ru').value, name: $('#rn').value, role: $('#rr').value,
      class_room: $('#rc').value, email: $('#re').value, pin: $('#rp').value, code: $('#rk').value });
    popup(r.message); S.reg = false; render();
  });
}

/* ---------- จัดการผู้ใช้ (admin) ---------- */
function vUsers() {
  $('#main').innerHTML = '<p>กำลังโหลด...</p>';
  run(async () => { S.users = await api('getUsers'); drawUsers(); });
}
function drawUsers() {
  const R = ['student', 'teacher', 'staff', 'admin'], on = u => u.status === 'active';
  const list = S.users.slice().sort((a, b) => on(a) - on(b)); // รออนุมัติขึ้นก่อน
  $('#main').innerHTML = list.map(u => `<div class="card"><div class="row"><b>${esc(u.name)}</b>
    <span class="tag ${on(u) ? 'ok' : 'pend'}">${on(u) ? 'ใช้งาน' : 'รออนุมัติ/ปิด'}</span></div>
    <small>${esc(u.user_id)} · ${esc(u.class_room)} · ${esc(u.email)}</small>
    <div class="grid" style="margin:8px 0"><select onchange="updUser('${esc(u.user_id)}',{role:this.value})">${R.map(r => `<option ${r === u.role ? 'selected' : ''}>${r}</option>`).join('')}</select>
    <button class="b ${on(u) ? 'g' : ''}" onclick="updUser('${esc(u.user_id)}',{status:'${on(u) ? 'inactive' : 'active'}'})">${on(u) ? 'ปิดบัญชี' : 'อนุมัติ'}</button></div>
    <button class="b g" onclick="resetPin('${esc(u.user_id)}')">รีเซ็ต PIN</button></div>`).join('') || '<p>ยังไม่มีผู้ใช้</p>';
}
function updUser(id, patch) { run(async () => { await api('updateUser', { user_id: id, ...patch }); vUsers(); }); }
async function resetPin(id) { const p = await ask('ตั้ง PIN ใหม่', 'ตัวเลข 4-8 หลัก', 'password'); if (p) updUser(id, { new_pin: p }); }

/* ---------- ป๊อปอัปแจ้งเตือน (แทน alert/prompt) ---------- */
function popup(msg, type, title) {
  type = type || (/สำเร็จ|แล้ว/.test(msg) ? 'ok' : 'warn');
  const I = { ok: ['✓', 'สำเร็จ'], warn: ['!', 'แจ้งเตือน'], error: ['✕', 'เกิดข้อผิดพลาด'] }[type], d = $('#pop');
  d.innerHTML = `<div class="pi ${type}">${I[0]}</div><h3>${esc(title || I[1])}</h3><p>${esc(msg)}</p><button class="b" onclick="$('#pop').close()">ตกลง</button>`;
  if (!d.open) d.showModal();
}
function ask(title, hint, type) {
  return new Promise(res => {
    const d = $('#pop');
    d.innerHTML = `<div class="pi warn">?</div><h3>${esc(title)}</h3><input type="${type || 'text'}" placeholder="${esc(hint || '')}" autocomplete="off"><div class="row2"><button class="b g" id="pc">ยกเลิก</button><button class="b" id="po">ยืนยัน</button></div>`;
    const i = d.querySelector('input');
    d.addEventListener('close', () => res(null), { once: true }); // Esc หรือปิด = ยกเลิก
    d.querySelector('#pc').onclick = () => d.close();
    d.querySelector('#po').onclick = () => { res(i.value); d.close(); };
    i.onkeydown = e => { if (e.key === 'Enter') d.querySelector('#po').click(); };
    if (!d.open) d.showModal(); i.focus();
  });
}

render();
</script>
